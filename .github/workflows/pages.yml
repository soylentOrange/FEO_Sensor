# Web app (docs/) of the newest release, with its update file, on GitHub Pages.
# Runs after every release (started by release.yml) and by hand (Actions -> Pages -> Run workflow);
# changes on main reach Pages only with the next release.
# Voraussetzung: Settings -> Pages -> Source "GitHub Actions" und Variable DEPLOY_PAGES = true.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # tags for the app version (git describe)

      - name: Seite mit neuester Firmware zusammenstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # neuestes veröffentlichtes Release, Pre-Releases eingeschlossen: dessen Web-App veröffentlichen
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q '[.[] | select(.draft | not)][0].tag_name // empty' || true)
          if [ -n "$TAG" ]; then git checkout -q "$TAG"; fi
          cp -r docs site
          # app version: the release tag (git describe of main without a release)
          if [ -f tools/app_build.py ]; then
            python3 tools/app_build.py "$(git describe --tags --always)" docs/index.html site/index.html
          fi
          mkdir -p site/fw
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*_update.bin' -D site/fw
            FILE=$(basename "$(ls site/fw/*_update.bin | head -1)")
            printf '{"version":"%s","file":"%s","tag":"%s"}\n' "${TAG#v}" "$FILE" "$TAG" > site/fw/latest.json
            cat site/fw/latest.json
          else
            echo "Noch kein Release: App ohne Firmware-Download"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # eigener Job (wie in GitHubs Vorlage): das Artefakt ist dann sicher registriert
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
