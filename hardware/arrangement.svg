<text x="800.3400000000001" y="160" class="sub">≈15 mm, straight to the right</text>
<rect x="766.3400000000001" y="176" width="26" height="9" rx="3" fill="#d62728"/>
<text x="800.3400000000001" y="185" class="txt" font-weight="bold">Pin 8 → D1</text>
<text x="800.3400000000001" y="202" class="sub">≈5 mm, straight to the right</text>
<rect x="766.3400000000001" y="218" width="26" height="9" rx="3" fill="#222"/>
<text x="800.3400000000001" y="227" class="txt" font-weight="bold">GND (C4) → GND</text>
<text x="800.3400000000001" y="244" class="sub">around the bottom of the XIAO</text>
<rect x="766.3400000000001" y="260" width="26" height="9" rx="3" fill="#c2185b"/>
<text x="800.3400000000001" y="269" class="txt" font-weight="bold">LiPo + → XH-1</text>
<text x="800.3400000000001" y="286" class="sub">battery leads on the left, short</text>
<rect x="766.3400000000001" y="302" width="26" height="9" rx="3" fill="#e91e63"/>
<text x="800.3400000000001" y="311" class="txt" font-weight="bold">XH-4 → BAT+</text>
<text x="800.3400000000001" y="328" class="sub">underneath the XIAO</text>
<rect x="766.3400000000001" y="344" width="26" height="9" rx="3" fill="#555"/>
<text x="800.3400000000001" y="353" class="txt" font-weight="bold">LiPo − → XH-2 (GND)</text>
<text x="800.3400000000001" y="370" class="sub">BAT− = GND, no wire to the pad</text>
<text x="766.3400000000001" y="402" class="txt">Thickness ≈11–12 mm</text>
<text x="766.3400000000001" y="421" class="txt">(battery 4 + foam 1 + board 1.6 + op-amp 4).</text>
<text x="766.3400000000001" y="440" class="txt">Board overhangs the battery by 3.6 mm on the left.</text>
<text x="766.3400000000001" y="459" class="txt">Alternatively let the XIAO overhang 1.8 mm</text>
<text x="766.3400000000001" y="478" class="txt">on the right, then 1.8 mm on each side.</text>
