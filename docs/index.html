<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>FEO-Sensor live</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a24">
<meta name="description" content="Live view of IMU, force sensor and battery voltage of the heel offloading orthosis sensor (Seeed XIAO nRF54L15 Sense) via Bluetooth LE or USB serial">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --grid: #e4e4df; --card: #fff;
    --x: #d1495b; --y: #2e8b57; --z: #2f6fbd; --m: #7a4fb5; --f: #c0700f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ececea; --muted: #9a9a94; --grid: #2c2c2a; --card: #1f1f1d;
            --x: #ef7585; --y: #5cc28a; --z: #6aa4ea; --m: #b48cf0; --f: #f0a24a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--fg); }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  button, select { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--grid);
                   background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--z); color: #fff; border-color: var(--z); }
  button.rec { background: var(--x); color: #fff; border-color: var(--x); }
  button:disabled { opacity: .45; cursor: default; }
  #status { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { padding: 0 16px 16px; display: grid; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px; }
  .card h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; display: flex; gap: 14px; flex-wrap: wrap; }
  .card h2 span { font-weight: 400; }
  .card h2 b { font: 600 13px ui-monospace, Menlo, monospace; white-space: pre; display: inline-block; text-align: right; }
  canvas { width: 100%; height: 260px; display: block; }
  main { grid-template-columns: minmax(0, 1fr) 380px; }
  .c3d { grid-column: 2; grid-row: 1 / span 2; }
  .c3d canvas { height: 380px; touch-action: none; }
  .c3d h2 { align-items: center; justify-content: space-between; }
  .c3d button { padding: 2px 10px; font-size: 12px; font-weight: 400; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint b { font: 600 12px ui-monospace, Menlo, monospace; white-space: pre; }
  .logc { grid-column: 1 / -1; }
  .sf { color: var(--f); }
  .cal .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 8px; }
  .cal input { font: inherit; width: 6.5em; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--grid);
               background: var(--card); color: var(--fg); }
  .cal canvas { height: 150px; }
  .cal table { width: 100%; border-collapse: collapse; font: 12px ui-monospace, Menlo, monospace; margin-top: 6px; }
  .cal th, .cal td { text-align: right; padding: 2px 6px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  .cal th { font-weight: 600; color: var(--muted); }
  .cal .tbl { max-height: 11em; overflow: auto; }
  .bat-low { color: var(--x); }
  .fcard { align-self: start; }
  .kgrow { align-items: center; }
  .kg { font-size: 28px; font-weight: 600; color: var(--f); }
  .card h2 .kg b { font: 700 28px ui-monospace, Menlo, monospace; }
  #coefTxt { white-space: normal; }
  .kgrow button { padding: 2px 10px; font-size: 12px; font-weight: 400; }
  .badge { font: 600 13px ui-monospace, Menlo, monospace; padding: 4px 10px; border-radius: 12px;
           border: 1px solid var(--grid); background: var(--card); white-space: nowrap; }
  .badge.bat-low { border-color: var(--x); }
  .fw .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0; }
  .fw progress { width: 100%; height: 10px; }
  .fw b { font: 600 12px ui-monospace, Menlo, monospace; }
  @media (max-width: 900px) { main, body[data-page=cal] main, body[data-page=align] main, body[data-page=gait] main { grid-template-columns: 1fr; } .c3d { grid-column: 1; grid-row: auto; } }
  @media (max-width: 600px) {
    header { padding: 10px 10px; gap: 8px; } h1 { flex: 1; order: 0; } .lang { order: 1; }
    header > :not(h1):not(.lang) { order: 2; } .spacer { display: none; }
    #status { order: 3; flex-basis: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    main { padding: 0 8px 8px; gap: 8px; } footer { padding: 0 10px 12px; }
    canvas { height: 190px; } .c3d canvas { height: 300px; } body[data-page=cal] .fcard canvas { height: 220px; }
    nav.tabs { padding: 0 8px; margin-bottom: 8px; } nav.tabs button { padding: 6px 10px; white-space: nowrap; }
    .card h2 { gap: 8px; }
  }
  footer .logos { display: flex; gap: 20px; align-items: center; margin-top: 8px; }
  footer .logos img { height: 40px; }
  .sm { color: var(--m); }
  .sx { color: var(--x); } .sy { color: var(--y); } .sz { color: var(--z); }
  #log { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap;
         max-height: 5.5em; overflow: auto; }
  .warn { padding: 12px 16px; color: var(--x); }
  .spacer { flex: 1; }
  nav.tabs { display: flex; gap: 4px; padding: 0 16px; margin-bottom: 12px; border-bottom: 1px solid var(--grid); }
  nav.tabs button { border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: none;
                    color: var(--muted); padding: 7px 14px; margin-bottom: -1px; }
  nav.tabs button.on { background: var(--card); color: var(--fg); border-color: var(--grid); font-weight: 600; }
  body:not([data-page=imu]) .t-imu, body:not([data-page=cal]) .t-cal, body:not([data-page=fw]) .t-fw,
  body:not([data-page=align]) .t-align, body:not([data-page=gait]) .t-gait { display: none; }
  body[data-page=align] main, body[data-page=gait] main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .al ol { margin: 6px 0; padding-left: 20px; } .al li { margin: 8px 0; }
  .al li b, #alRes { font: 600 12px ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .al .row, .gsum .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 6px 0; }
  .tile { border: 1px solid var(--grid); border-radius: 6px; padding: 6px 8px; }
  .tile span { display: block; font-size: 11px; color: var(--muted); }
  .tile b { font: 600 18px ui-monospace, Menlo, monospace; }
  .tile.f b { color: var(--f); }
  .gt table { width: 100%; border-collapse: collapse; font: 12px ui-monospace, Menlo, monospace; }
  .gt th, .gt td { text-align: right; padding: 2px 6px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  .gt th { font-weight: 600; color: var(--muted); } .gt .tbl { max-height: 16em; overflow: auto; }
  .t-gait canvas { height: 220px; }
  body[data-page=cal] main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  body[data-page=cal] .fcard canvas { height: 320px; }
  body[data-page=fw] main { grid-template-columns: minmax(0, 1fr); }
  .lang button { padding: 4px 8px; font-size: 12px; }
  .lang button:first-child { border-radius: 6px 0 0 6px; } .lang button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .lang button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  footer { padding: 0 16px 16px; font-size: 12px; color: var(--muted); }
  footer a { color: var(--z); }
</style>
</head>
<body>
<header>
  <h1>FEO-Sensor live</h1>
  <button id="connect" class="primary"></button>
  <button id="ble" class="primary"></button>
  <button id="record" disabled></button>
  <label><span data-i18n="window"></span>
    <select id="window">
      <option value="5">5 s</option><option value="10" selected>10 s</option><option value="30">30 s</option>
    </select>
  </label>
  <button id="pause" disabled></button>
  <span id="status"></span>
  <span id="batBadge" class="badge" hidden></span>
  <span class="spacer"></span>
  <span class="lang"><button id="lang-de">DE</button><button id="lang-en">EN</button></span>
</header>
<div id="nows" class="warn" hidden data-i18n="nows"></div>
<nav class="tabs">
  <button data-page="imu" data-i18n="tabImu"></button>
  <button data-page="cal" data-i18n="tabCal"></button>
  <button data-page="align" data-i18n="tabAlign"></button>
  <button data-page="gait" data-i18n="tabGait"></button>
  <button data-page="fw" data-i18n="tabFw"></button>
</nav>
<main>
  <div class="card t-imu">
    <h2><span data-i18n="acc"></span>
      <span class="sx">x <b id="vax">–</b></span><span class="sy">y <b id="vay">–</b></span><span class="sz">z <b id="vaz">–</b></span><span class="sm">|a| <b id="vam">–</b></span>
    </h2>
    <canvas id="acc"></canvas>
  </div>
  <div class="card c3d t-imu">
    <h2><span data-i18n="orient"></span> <span><button id="flip" data-i18n="flip" data-i18n-title="flipT"></button>
      <button id="zero" data-i18n="zero" data-i18n-title="zeroT"></button></span></h2>
    <canvas id="view3d"></canvas>
    <div class="hint">Roll <b id="vroll">–</b>° · Pitch <b id="vpitch">–</b>° · Yaw <b id="vyaw">–</b>°<br>
      <span data-i18n="hint1"></span><br>
      <span data-i18n="hint2"></span></div>
  </div>
  <div class="card t-imu">
    <h2><span data-i18n="gyr"></span>
      <span class="sx">x <b id="vgx">–</b></span><span class="sy">y <b id="vgy">–</b></span><span class="sz">z <b id="vgz">–</b></span><span class="sm">|ω| <b id="vgm">–</b></span>
    </h2>
    <canvas id="gyr"></canvas>
  </div>
  <div class="card fcard t-cal">
    <h2><span data-i18n="fsr"></span>
      <span class="sf">U <b id="vfsr">–</b> mV</span><span><span data-i18n="range"></span> <b id="vrange">–</b></span>
      <span><span data-i18n="bat"></span> <b id="vbat">–</b></span>
    </h2>
    <h2 class="kgrow"><span class="kg"><b id="vkg">–</b> kg</span>
      <button id="zeroFsr" data-i18n="zeroFsr" data-i18n-title="zeroFsrT"></button>
      <span class="hint" id="vref"></span>
    </h2>
    <canvas id="fsrc"></canvas>
  </div>
  <div class="card cal t-cal">
    <h2><span data-i18n="cal"></span></h2>
    <div class="row">
      <label><span data-i18n="refKg"></span> <input id="refkg" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00"></label>
      <label><span data-i18n="avg"></span>
        <select id="avgs"><option value="0.5">0,5 s</option><option value="1" selected>1 s</option><option value="2">2 s</option><option value="3">3 s</option></select></label>
    </div>
    <div class="row">
      <button id="calAdd" class="primary" disabled data-i18n="calAdd"></button>
      <button id="calUndo" data-i18n="calUndo"></button>
      <button id="calClear" data-i18n="calClear"></button>
      <button id="calCsv" data-i18n="calCsv"></button>
    </div>
    <div class="hint"><span data-i18n="calNow"></span> <b id="vavg">–</b></div>
    <canvas id="calc"></canvas>
    <div class="tbl"><table><thead><tr><th>#</th><th>kg</th><th>U̅ mV</th><th>σ mV</th><th>n</th><th data-i18n="rangeS"></th><th data-i18n="batS"></th></tr></thead>
      <tbody id="calt"></tbody></table></div>
    <div class="hint" data-i18n="calHint"></div>
    <h2 style="margin-top:10px"><span data-i18n="coef"></span></h2>
    <div class="hint"><b id="coefTxt">–</b></div>
    <div class="row">
      <label>Rf (Ω) <input id="rfIn" type="number" step="100" min="100" value="12000"></label>
      <button id="calFit" data-i18n="calFit"></button>
      <button id="calWrite" data-i18n="calWrite" disabled></button>
      <button id="calFactory" data-i18n="calFactory"></button>
    </div>
    <div class="hint" id="fitTxt"></div>
  </div>
  <div class="card al t-align">
    <h2><span data-i18n="alTitle"></span> <span class="hint" id="alDev"></span></h2>
    <div class="hint" data-i18n="alIntro"></div>
    <div class="row"><label><span data-i18n="alMode"></span>
      <select id="alMode"><option value="walk" data-i18n="alWalk"></option><option value="pend" data-i18n="alPend"></option></select></label></div>
    <ol>
      <li><span data-i18n="alS1"></span><div class="row"><button id="alStill" data-i18n="alStillB"></button> <b id="alStillR"></b></div></li>
      <li><span id="alS2"></span><div class="row"><button id="alMove"></button> <b id="alMoveR"></b></div></li>
      <li><span data-i18n="alS3"></span><div class="row"><button id="alDir" data-i18n="alDirB"></button>
        <button id="alFlip" data-i18n="alFlip"></button> <b id="alDirR"></b></div></li>
    </ol>
    <div class="hint"><b id="alRes">–</b></div>
    <div class="row"><button id="alWrite" class="primary" disabled data-i18n="alWrite"></button>
      <button id="alAuto" disabled data-i18n="alAuto"></button></div>
  </div>
  <div class="card t-align">
    <h2><span data-i18n="alLive"></span> <span class="sz">ω<sub>sag</sub> <b id="vsag">–</b> °/s</span></h2>
    <canvas id="sagc"></canvas>
    <div class="hint" data-i18n="alLiveHint"></div>
  </div>
  <div class="card gsum t-gait">
    <h2><span data-i18n="gTitle"></span> <span class="hint" id="gSrc"></span></h2>
    <div class="tiles">
      <div class="tile"><span data-i18n="gN"></span><b id="gtN">–</b></div>
      <div class="tile"><span data-i18n="gCad"></span><b id="gtCad">–</b></div>
      <div class="tile"><span data-i18n="gStride"></span><b id="gtStride">–</b></div>
      <div class="tile"><span data-i18n="gStance"></span><b id="gtStance">–</b></div>
      <div class="tile f"><span data-i18n="gPeak"></span><b id="gtPeak">–</b></div>
      <div class="tile f"><span data-i18n="gLR"></span><b id="gtLR">–</b></div>
      <div class="tile f"><span data-i18n="gSwing"></span><b id="gtSwing">–</b></div>
    </div>
    <div class="row">
      <label><span data-i18n="gAvg"></span> <select id="gSel"><option value="10">10</option><option value="30" selected>30</option>
        <option value="100">100</option><option value="0" data-i18n="gAll"></option></select></label>
      <button id="gLoad" disabled data-i18n="gLoad"></button>
      <button id="gCsv" data-i18n="gCsv"></button>
      <button id="gClear" data-i18n="gClear"></button>
    </div>
    <div class="hint" data-i18n="gHint"></div>
  </div>
  <div class="card t-gait">
    <h2><span data-i18n="gPhase"></span></h2>
    <canvas id="gPh"></canvas>
    <div class="hint" data-i18n="gPhHint"></div>
  </div>
  <div class="card t-gait">
    <h2><span data-i18n="gCycle"></span></h2>
    <canvas id="gCyc"></canvas>
  </div>
  <div class="card t-gait">
    <h2><span data-i18n="gTrend"></span></h2>
    <canvas id="gTr"></canvas>
  </div>
  <div class="card gt logc t-gait">
    <h2><span data-i18n="gTable"></span></h2>
    <div class="tbl"><table><thead><tr><th>#</th><th>t s</th><th data-i18n="gThStride"></th><th data-i18n="gThStance"></th><th>MS °/s</th>
      <th data-i18n="gThPeak"></th><th data-i18n="gThMean"></th><th>LR</th><th>MSt</th><th>TSt</th><th>PSw</th><th data-i18n="gThSw"></th><th></th></tr></thead>
      <tbody id="gTb"></tbody></table></div>
  </div>
  <div class="card fw logc t-fw">
    <h2><span data-i18n="fw"></span> <span><span data-i18n="fwInst"></span> <b id="fwver">–</b></span></h2>
    <div class="row">
      <button id="fwLatest" disabled hidden></button>
      <button id="fwPick" disabled data-i18n="fwPick"></button>
      <input id="fwFile" type="file" accept=".bin,application/octet-stream" hidden>
      <span id="fwState" class="hint"></span>
    </div>
    <progress id="fwProg" max="1" value="0" hidden></progress>
  </div>
  <div class="card logc"><div id="log"></div></div>
</main>
<footer><span data-i18n="project"></span> <a href="https://horizon-smile.eu/" target="_blank" rel="noopener">SmILE – Smart Implants for Life Enrichment</a>.
  <div class="logos"><a href="https://horizon-smile.eu/" target="_blank" rel="noopener"><img src="assets/Smile-logo.svg" alt="SmILE"></a>
    <img src="assets/eu-funded.svg" alt="Funded by the European Union"></div></footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
const MAXPTS = 30 * 250;          // Puffer für bis zu 30 s bei 250 Hz
const buf = [];                   // [t_ms, ax, ay, az, gx, gy, gz, |a|, |ω|, u_fsr_mv, fsr_range_mv, u_bat_mv]
let port = null, reader = null, keepReading = false, paused = false;
let recording = null;             // Array von Zeilen oder null
let rateCount = 0, rateT0 = performance.now(), rateHz = 0;

// ---------- Sprache (DE / EN) ----------
const TEXT = {
  de: {
    window: "Fenster", nows: "Dieser Browser kann weder auf Bluetooth noch auf USB-Seriell zugreifen. Bitte Chrome oder Edge verwenden (am PC/Mac oder auf Android), die Seite über https öffnen, oder in Brave Web Bluetooth aktivieren.",

    recOn: "Aufnahme starten", recOff: "Aufnahme stoppen", pause: "Pause", resume: "Weiter",
    stIdle: "nicht verbunden", stWait: "verbunden, warte auf Daten …", stBle: "verbinde per Bluetooth …",
    stRec: n => ` · Aufnahme: ${n} Messungen`,
    logBleOff: "# Bluetooth getrennt", logBleOn: n => "# Bluetooth verbunden: " + n, logBleErr: m => "Bluetooth-Fehler: " + m,
    logBrave: "Brave: brave://flags/#brave-web-bluetooth-api auf \"Enabled\" stellen und Brave neu starten.",
    logConnErr: m => "Verbindung fehlgeschlagen: " + m, logReadErr: m => "Lesefehler: " + m,
    logSaved: (n, f) => `# ${n} Messungen gespeichert als ${f}`, logZero: b => `# Genullt, Gyro-Offset ${b} °/s`,

    vrefSrc: (v, s) => `V_ref ${v} mV (${s})`, srcUser: "genullt", srcBoot: "beim Einschalten", srcCal: "Kalibrierung",
    zeroBad: v => `Nullen abgelehnt: ${v} mV liegt außerhalb 60–150 mV (Sensor belastet?)`,
    coef: "Koeffizienten (R_FSR = RS + K·kg^−N)", calFit: "Aus Messpunkten fitten", calWrite: "Ins Gerät schreiben", calFactory: "Werkswerte",
    srcDev: "aus dem Gerät", srcLocal: "zuletzt gelesen", srcFit: "neu gefittet, noch nicht gespeichert", srcFactory: "Werkswerte",

    calSaved: "# Kalibrierung im Gerät gespeichert", calErr: m => "Kalibrierung schreiben fehlgeschlagen: " + m,

const FEO_SVC = "7a1e0011-5c3b-4f0a-9d2e-3c8f1b6a4d01";
const FEO_DATA = "7a1e0012-5c3b-4f0a-9d2e-3c8f1b6a4d01";
const FEO_BAT = "7a1e0013-5c3b-4f0a-9d2e-3c8f1b6a4d01";
const FEO_CAL = "7a1e0014-5c3b-4f0a-9d2e-3c8f1b6a4d01";
const SAMPLE_MS = 10;
const RANGES_MV = [900, 1800, 3600];   // Messbereich je nach SAADC-Gain 1, 1/2, 1/4
let bleDev = null;
let batMv = 0;                         // letzte Akkuspannung (mV), 0 = unbekannt
let batChr = null, batT = 0, dataChr = null;           // Akku-Characteristic, Zeitpunkt des letzten Werts

$("ble").onclick = async () => {
  if (bleDev) { bleDev.gatt.disconnect(); return; }
  try {
    bleDev = await navigator.bluetooth.requestDevice({ filters: [{ services: [FEO_SVC] }], optionalServices: [SMP_SVC] });
    bleDev.addEventListener("gattserverdisconnected", () => {
      log(T("logBleOff")); bleDev = null; batChr = null; calChr = null; $("calWrite").disabled = true; smpDisconnected();
      dataChr = frameChr = stepChr = null; streamOn = false; alButtons(); $("gLoad").disabled = true;
      $("ble").textContent = T("bleOn"); setStatus("stIdle");
    });
    setStatus("stBle");
    const server = await bleDev.gatt.connect();
    const svc = await server.getPrimaryService(FEO_SVC);
    const ch = dataChr = await svc.getCharacteristic(FEO_DATA);
    ch.addEventListener("characteristicvaluechanged", e => handlePacket(e.target.value));
    streamOn = false; await updateStreaming();   // Rohdaten nur, wenn eine Seite sie braucht
    try {
      const bat = await svc.getCharacteristic(FEO_BAT);
      bat.addEventListener("characteristicvaluechanged", e => { batMv = e.target.value.getUint16(0, true); batT = Date.now(); });
      batMv = (await bat.readValue()).getUint16(0, true); batT = Date.now();
      await bat.startNotifications();
      batChr = bat;
    } catch (e) { log(T("logBleErr", e.message)); }
    try { calChr = await svc.getCharacteristic(FEO_CAL); await calRead(); } catch (e) { calChr = null; }
    await gaitConnect(svc);
    await smpConnect(server);
    $("ble").textContent = T("bleOff");
    $("record").disabled = false; $("pause").disabled = false; $("calAdd").disabled = false;
    log(T("logBleOn", bleDev.name || "XIAO-FEO"));
  } catch (e) {
    log(T("logBleErr", e.message));
    if (/globally disabled/i.test(e.message))
      log(T("logBrave"));
    if (bleDev && bleDev.gatt.connected) bleDev.gatt.disconnect();
    bleDev = null;
  }
};

// Paket: uint32 t_ms, uint8 n, n x { 6 x int16 IMU, uint16 FSR (Bit 0..13 mV, Bit 14..15 Messbereich) }
const PKT_SAMPLE = 14;
function handlePacket(dv) {
  if (dv.byteLength < 5) return;
  const t0 = dv.getUint32(0, true), n = dv.getUint8(4);
  for (let i = 0; i < n && 5 + (i + 1) * PKT_SAMPLE <= dv.byteLength; i++) {
    const o = 5 + i * PKT_SAMPLE, g = k => dv.getInt16(o + 2 * k, true);
    const f = dv.getUint16(o + 12, true);
    const v = [t0 + i * SAMPLE_MS, g(0) / 1000, g(1) / 1000, g(2) / 1000, g(3) / 10, g(4) / 10, g(5) / 10];
    handleLine(v[0] + "," + v.slice(1, 4).map(x => x.toFixed(3)).join(",") + "," +
               v.slice(4).map(x => x.toFixed(1)).join(",") + "," +
               (f & 0x3fff) + "," + (RANGES_MV[f >> 14] || 0) + "," + batMv);
  }
}

function log(msg) {
  const el = $("log");
  el.textContent += msg + "\n";
  const lines = el.textContent.split("\n");
  if (lines.length > 30) el.textContent = lines.slice(-30).join("\n");
  el.scrollTop = el.scrollHeight;
}
// Status: Schlüssel aus TEXT (bleibt beim Sprachwechsel gültig) oder fertiger Text
function setStatus(s) { statusKey = TEXT[lang][s] ? s : null; $("status").textContent = statusKey ? T(s) : s; }

$("connect").onclick = async () => {
  if (port) { await disconnect(); return; }
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
  } catch (e) { port = null; log(T("logConnErr", e.message)); return; }
  $("connect").textContent = T("usbOff");
  $("record").disabled = false; $("pause").disabled = false; $("calAdd").disabled = false;
  setStatus("stWait");
  readLoop();
};

async function disconnect() {
  keepReading = false;
  try { if (reader) await reader.cancel(); } catch (e) {}
  try { await port.close(); } catch (e) {}
  port = null; reader = null;
  $("connect").textContent = T("usbOn");
  $("pause").disabled = true;
  setStatus("stIdle");
}

async function readLoop() {
  keepReading = true;
  const decoder = new TextDecoder();
  let rest = "";
  while (port && port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        rest += decoder.decode(value, { stream: true });
        let i;
        while ((i = rest.indexOf("\n")) >= 0) {
          handleLine(rest.slice(0, i).trim());
          rest = rest.slice(i + 1);
        }
      }
    } catch (e) {
      log(T("logReadErr", e.message));
      break;
    } finally {
      reader.releaseLock();
    }
  }
  if (port) await disconnect();
}

function handleLine(line) {
  if (!line) return;
  if (line.startsWith("#S,")) { stepCsv(line); return; }
  if (line.startsWith("#")) { log(line); return; }
  const p = line.split(",");
  if (p.length !== 10) return;
  const r = p.map(Number);
  if (r.some(Number.isNaN)) return;
  // interne Reihenfolge: t, a, ω, |a|, |ω|, u_fsr, Messbereich, u_bat
  const v = r.slice(0, 7);
  v.push(Math.hypot(v[1], v[2], v[3]), Math.hypot(v[4], v[5], v[6]), r[7], r[8], r[9]);
  if (r[9] > 0) batMv = r[9];
  v.push(fsrKg(r[7]));                 // [12] kg aus der Kalibrierung
  v.push(sagRate(v));                  // [13] sagittale Drehrate (Ausrichtung)
  alCollect(v);
  ahrsUpdate(v);
  if (buf.length && v[0] < buf[buf.length - 1][0]) buf.length = 0;   // Board neu gestartet
  buf.push(v);
  if (buf.length > MAXPTS) buf.splice(0, buf.length - MAXPTS);
  if (recording) recording.push(line + "," + refKgText() + "," + (Number.isFinite(v[12]) ? v[12].toFixed(3) : ""));
  rateCount++;
}

$("pause").onclick = () => { paused = !paused; $("pause").textContent = T(paused ? "resume" : "pause"); };

$("record").onclick = () => {
  if (!recording) {
    recording = [];
    updateStreaming();
    $("record").textContent = T("recOff");
    $("record").classList.add("rec");
  } else {
    const csv = CSV_HEAD + ",ref_kg,kg\n" + recording.join("\n") + "\n";
    const n = recording.length;
    recording = null;
    updateStreaming();
    $("record").textContent = T("recOn");
    $("record").classList.remove("rec");
    const ts = fileTs();
    log(T("logSaved", n, download(csv, `feo_${ts}.csv`)));
  }
};

const CSV_HEAD = "t_ms,ax_g,ay_g,az_g,gx_dps,gy_dps,gz_dps,u_fsr_mv,fsr_range_mv,u_bat_mv";
const fileTs = () => new Date().toISOString().replace(/[:T]/g, "-").slice(0, 19);
function download(text, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return name;
}

const SMP_CHR = "da2e7828-fbce-4e01-ae9e-261174997c48";
// Web Bluetooth verrät die ausgehandelte MTU nicht, und mehrere schnell hintereinander gesendete
// Writes ohne Antwort gehen (z. B. unter macOS) verloren. Deshalb: vor dem Upload per Echo prüfen,
// ob ein 180-Byte-Write ankommt; dann passt jedes SMP-Paket in genau einen Write. Sonst 20-Byte-
// Stücke mit Pause dazwischen (die Firmware setzt die Pakete wieder zusammen).
let smpFrag = 20, smpPace = 0, smpData = 128;
let smpChr = null, smpSeq = 0, smpWait = null, smpRx = null, fwBusy = false, fwInstalled = null, fwLatestInfo = null;

// --- minimales CBOR (nur was SMP braucht) ---
function cborEnc(v) {
  const out = [];
  const head = (mt, n) => {
    if (n < 24) out.push(mt << 5 | n);
    else if (n < 256) out.push(mt << 5 | 24, n);
    else if (n < 65536) out.push(mt << 5 | 25, n >> 8, n & 255);
    else out.push(mt << 5 | 26, n >>> 24, n >> 16 & 255, n >> 8 & 255, n & 255);
  };
  const enc = x => {
    if (x === true || x === false) out.push(x ? 0xf5 : 0xf4);
    else if (typeof x === "number") { if (x >= 0) head(0, x); else head(1, -1 - x); }
    else if (typeof x === "string") { const b = new TextEncoder().encode(x); head(3, b.length); out.push(...b); }
    else if (x instanceof Uint8Array) { head(2, x.length); for (const b of x) out.push(b); }
    else if (Array.isArray(x)) { head(4, x.length); x.forEach(enc); }
    else { const k = Object.keys(x); head(5, k.length); k.forEach(key => { enc(key); enc(x[key]); }); }
  };
  enc(v);
  return new Uint8Array(out);
}
function cborDec(buf) {
  let i = 0;
  const len = ai => ai < 24 ? ai : ai === 24 ? buf[i++] : ai === 25 ? (i += 2, buf[i - 2] << 8 | buf[i - 1])
    : ai === 26 ? (i += 4, ((buf[i - 4] << 24) >>> 0) + (buf[i - 3] << 16 | buf[i - 2] << 8 | buf[i - 1])) : -1;
  const dec = () => {
    const b = buf[i++], mt = b >> 5, ai = b & 31;
    if (mt === 7) return ai === 21 ? true : ai === 20 ? false : null;
    const n = ai === 31 ? -1 : len(ai);
    if (mt === 0) return n;
    if (mt === 1) return -1 - n;
    if (mt === 2) { const r = buf.slice(i, i + n); i += n; return r; }
    if (mt === 3) { const r = new TextDecoder().decode(buf.slice(i, i + n)); i += n; return r; }
    if (mt === 4 || mt === 5) {
      const r = mt === 4 ? [] : {};
      for (let k = 0; n < 0 ? buf[i] !== 0xff : k < n; k++) { if (mt === 4) r.push(dec()); else { const key = dec(); r[key] = dec(); } }
      if (n < 0) i++;
      return r;
    }
    if (mt === 6) return dec();   // Tag ignorieren
    throw new Error("CBOR");
  };
  return dec();
}

// --- SMP-Rahmen: op, flags, len (BE), group (BE), seq, id + CBOR ---
async function smpCall(op, group, id, body, timeout = 5000, frag = 0) {
  const payload = cborEnc(body), seq = smpSeq = (smpSeq + 1) & 255;
  const pkt = new Uint8Array(8 + payload.length);
  pkt.set([op, 0, payload.length >> 8, payload.length & 255, group >> 8, group & 255, seq, id]);
  pkt.set(payload, 8);
  const resp = new Promise((resolve, reject) => {
    smpWait = { seq, resolve, reject, timer: setTimeout(() => { smpWait = null; reject(new Error("Timeout")); }, timeout) };
  });
  const fs = frag || smpFrag;
  smpRx = null;
  for (let o = 0; o < pkt.length; o += fs) {
    if (o && smpPace) await new Promise(r => setTimeout(r, smpPace));
    await smpChr.writeValueWithoutResponse(pkt.slice(o, o + fs));
  }
  const r = await resp;
  if (r.rc) throw new Error("SMP rc " + r.rc);
  if (r.err && r.err.rc) throw new Error("SMP err " + r.err.group + "/" + r.err.rc);
  return r;
}
function smpNotify(dv) {
  const b = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  smpRx = smpRx ? Uint8Array.from([...smpRx, ...b]) : Uint8Array.from(b);
  if (smpRx.length < 8) return;
  const need = 8 + (smpRx[2] << 8 | smpRx[3]);
  if (smpRx.length < need) return;
  const seq = smpRx[6], body = smpRx.slice(8, need);
  smpRx = null;
  if (smpWait && smpWait.seq === seq) {
    const w = smpWait; smpWait = null; clearTimeout(w.timer);
    try { w.resolve(cborDec(body)); } catch (e) { w.reject(e); }
  }
}

const verStr = v => v || "?";
async function smpConnect(server) {
  smpChr = null; fwInstalled = null; $("fwver").textContent = "–";
  try {
    smpChr = await (await server.getPrimaryService(SMP_SVC)).getCharacteristic(SMP_CHR);
    smpChr.addEventListener("characteristicvaluechanged", e => smpNotify(e.target.value));
    await smpChr.startNotifications();
    const st = await smpCall(0, 1, 0, {});
    const act = (st.images || []).find(im => im.active) || (st.images || [])[0];
    fwInstalled = act ? act.version : null;
    $("fwver").textContent = act ? `${verStr(act.version)}${act.confirmed ? "" : " (Test)"}` : "?";
    $("fwPick").disabled = false; fwShowLatest();

    smpChr = null; $("fwver").textContent = "–"; $("fwState").textContent = T("fwNoSmp");
  }
}

  smpChr = null;
  if (smpWait) { clearTimeout(smpWait.timer); smpWait.reject(new Error("getrennt")); smpWait = null; }
  $("fwPick").disabled = true; $("fwLatest").disabled = true;
}

// MCUboot-Image prüfen: Magic, Version und SHA-256 aus den TLVs
function parseImage(buf) {
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  if (buf.length < 32 || dv.getUint32(0, true) !== 0x96f3b83d) return null;
  const hdr = dv.getUint16(8, true), size = dv.getUint32(12, true);
  const version = `${dv.getUint8(20)}.${dv.getUint8(21)}.${dv.getUint16(22, true)}`;
  let o = hdr + size, hash = null;
  if (o + 4 <= buf.length && dv.getUint16(o, true) === 0x6908) o += dv.getUint16(o + 2, true);   // geschützte TLVs
  if (o + 4 > buf.length || dv.getUint16(o, true) !== 0x6907) return null;
  const end = o + dv.getUint16(o + 2, true);
  for (o += 4; o + 4 <= end; o += 4 + dv.getUint16(o + 2, true))
    if (dv.getUint8(o) === 0x10) hash = buf.slice(o + 4, o + 4 + dv.getUint16(o + 2, true));
  return hash ? { version, hash } : null;
}

async function fwInstall(buf) {
  const img = parseImage(buf);
  if (!img) { $("fwState").textContent = T("fwBad"); return; }
  const cur = fwInstalled ? verStr(fwInstalled) : "?";
  if (cur === img.version && !confirm(T("fwSame") + "\n\n" + T("fwAsk", img.version, cur))) return;
  if (cur !== img.version && !confirm(T("fwAsk", img.version, cur))) return;
  fwBusy = true; $("fwPick").disabled = $("fwLatest").disabled = true;
  const prog = $("fwProg"); prog.hidden = false; prog.value = 0;
  try {
    // Messdaten-Streaming pausieren: die volle Bandbreite gehört dem Upload
    for (const c of [dataChr, batChr, stepChr]) { try { if (c) await c.stopNotifications(); } catch (e) {} }
    streamOn = false;
    // größte Schreib-Größe finden, die vollständig ankommt (Echo mit passend langem Text)
    try {
      await smpCall(2, 0, 0, { d: "x".repeat(180 - 14) }, 3000, 180);   // genau 179 Byte, ein Write
      smpFrag = 180; smpPace = 0; smpData = 128;                         // Upload-Paket ≤ 170 Byte
    } catch (e) {
      smpFrag = 20; smpPace = 8; smpData = 128;
    }
    log(`# Update: ${smpFrag} Byte pro Schreibvorgang`);
    const t0 = performance.now();
    let off = 0, tries = 0;
    while (off < buf.length) {
      const body = { image: 0, off, data: buf.slice(off, off + smpData) };
      if (off === 0) body.len = buf.length;
      let r;
      try { r = await smpCall(2, 1, 1, body, off === 0 ? 30000 : 5000); tries = 0; }   // erster Block: Slot löschen
      catch (e) { if (e.message !== "Timeout" || ++tries > 3) throw e; continue; }    // Block wiederholen
      off = typeof r.off === "number" ? r.off : off + body.data.length;
      prog.value = off / buf.length;
      const kbs = (off / 1024 / ((performance.now() - t0) / 1000)).toFixed(1);
      $("fwState").textContent = T("fwUp", Math.round(prog.value * 100), kbs);
    }
    await smpCall(2, 1, 0, { hash: img.hash, confirm: false });   // beim nächsten Start testen
    $("fwState").textContent = T("fwReboot"); log("# " + T("fwReboot"));
    try { await smpCall(2, 0, 5, {}, 2000); } catch (e) { /* Board trennt beim Neustart */ }
  } catch (e) {
    $("fwState").textContent = T("fwErr", e.message); log(T("fwErr", e.message));
    if (smpChr) $("fwPick").disabled = false;
  } finally {
    fwBusy = false; prog.hidden = true; fwShowLatest();
    if (bleDev && bleDev.gatt.connected) updateStreaming();
    // nach einem Fehler Streaming wieder starten (nach Erfolg startet das Board ohnehin neu)
    if (bleDev && bleDev.gatt.connected)
      for (const c of [batChr, stepChr]) { try { if (c) await c.startNotifications(); } catch (e) {} }
  }
}

// ---------- kg aus der Kalibrierung ----------
// Modell: R_FSR = RS + K * kg^-N, U = VREF * (1 + RF / R_FSR). Koeffizienten liegen im Gerät
// (Characteristic FEO_CAL, im Flash gespeichert); die App rechnet kg aus.
const CAL_FACTORY = { vref: 94.9, rf: 12000, rs: 324.7, k: 4704.9, n: 1.102, stamp: 0 };
let cal = { ...CAL_FACTORY }, calSrc = "srcFactory", calChr = null, vref0 = 0, vrefUser = 0;
try { const c = JSON.parse(localStorage.getItem("feoCalCoef")); if (c && c.k > 0) { cal = c; calSrc = "srcLocal"; } } catch (e) {}
const vrefEff = () => vrefUser || vref0 || cal.vref;
function fsrKg(u) {
  const vr = vrefEff();
  if (!(u > vr + 2)) return 0;                      // ~2 mV Totband gegen Rauschen
  const den = vr * cal.rf / (u - vr) - cal.rs;
  return den > 0 ? Math.pow(cal.k / den, 1 / cal.n) : Infinity;   // Infinity = Überlast
}
function showCal() {
  $("coefTxt").textContent = `RS ${cal.rs.toFixed(1)} Ω · K ${cal.k.toFixed(1)} · N ${cal.n.toFixed(4)} · Rf ${cal.rf.toFixed(0)} Ω · V_ref ${cal.vref.toFixed(1)} mV — ${T(calSrc)}` +
    (cal.stamp ? ` (${new Date(cal.stamp * 1000).toLocaleDateString()})` : "");
  $("rfIn").value = cal.rf;
  const src = vrefUser ? "srcUser" : vref0 ? "srcBoot" : "srcCal";
  $("vref").textContent = T("vrefSrc", vrefEff().toFixed(1), T(src));
}

  vref0 = dv.byteLength >= 28 ? f(6) : 0;

}

// Fit RS, K, N aus den Kalibrierpunkten: für jedes RS lineare Regression ln(R-RS) = ln K - N ln kg,
// RS so wählen, dass der Fehler der Umkehrfunktion (in ln kg) minimal wird
function fitCal(pts, vref, rf) {
  const P = pts.filter(p => p.kg > 0 && p.mean > vref + 2).map(p => ({ kg: p.kg, R: vref * rf / (p.mean - vref) }));
  if (P.length < 3) return null;
  const rmin = Math.min(...P.map(p => p.R));
  const evalRs = rs => {
    const xs = P.map(p => Math.log(p.kg)), ys = P.map(p => Math.log(p.R - rs));
    const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
    let sxy = 0, sxx = 0;
    xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
    if (sxx === 0) return null;
    const n = -sxy / sxx, k = Math.exp(my + n * mx);
    if (!(n > 0.1 && n < 10)) return null;
    const err = P.reduce((a, p) => a + (Math.log(Math.pow(k / (p.R - rs), 1 / n)) - Math.log(p.kg)) ** 2, 0) / P.length;
    return { rs, k, n, err };
  };
  let best = null;
  for (let i = 0; i < 400; i++) { const r = evalRs(rmin * 0.995 * i / 400); if (r && (!best || r.err < best.err)) best = r; }
  return best && { ...best, n_pts: P.length, mape: P.reduce((a, p) => a + Math.abs(Math.pow(best.k / (p.R - best.rs), 1 / best.n) / p.kg - 1), 0) / P.length };
}
$("calFit").onclick = () => {
  const rf = Number($("rfIn").value) || cal.rf;
  const zeros = calPts.filter(p => p.kg === 0);
  const vref = zeros.length ? zeros.reduce((a, p) => a + p.mean, 0) / zeros.length : vrefEff();
  const r = fitCal(calPts, vref, rf);
  if (!r) { $("fitTxt").textContent = T("fitNeed"); return; }
  cal = { vref, rf, rs: r.rs, k: r.k, n: r.n, stamp: Math.floor(Date.now() / 1000) };
  calSrc = "srcFit"; showCal();
  $("fitTxt").textContent = T("fitRes", (r.mape * 100).toFixed(1), r.n_pts);
};

// Statistik der FSR-Spannung über die letzten avg Sekunden
function fsrWindowStats(sec) {
  if (!buf.length) return null;
  const tEnd = buf[buf.length - 1][0], tStart = tEnd - (sec || Number($("avgs").value)) * 1000;
  const xs = [], ranges = new Set();
  for (let i = buf.length - 1; i >= 0 && buf[i][0] > tStart; i--) {
    if (buf[i][10] > 0) { xs.push(buf[i][9]); ranges.add(buf[i][10]); }
  }
  if (!xs.length) return null;
  const mean = xs.reduce((s, x) => s + x, 0) / xs.length;
  const sd = Math.sqrt(xs.reduce((s, x) => s + (x - mean) ** 2, 0) / Math.max(1, xs.length - 1));
  return { mean, sd, min: Math.min(...xs), max: Math.max(...xs), n: xs.length, ranges: [...ranges].sort((a, b) => a - b).join("/") };
}

function drawCal() {
  const canvas = $("calc"), dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== W * dpr || canvas.height !== H * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const L = 48, R = 8, Tp = 6, B = 20, pw = W - L - R, ph = H - Tp - B;
  const kmax = Math.max(1, ...calPts.map(p => p.kg)) * 1.1, umax = Math.max(100, ...calPts.map(p => p.max)) * 1.1;
  const X = k => L + k / kmax * pw, Y = u => Tp + (1 - u / umax) * ph;
  ctx.font = "11px -apple-system, sans-serif"; ctx.fillStyle = css("--muted"); ctx.strokeStyle = css("--grid"); ctx.lineWidth = 1;
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  const us = niceStep(umax);
  for (let u = 0; u <= umax; u += us) { const y = Math.round(Y(u)) + .5; ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke(); ctx.fillText(+u.toFixed(0), L - 6, y); }
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const ks = niceStep(kmax);
  for (let k = 0; k <= kmax; k += ks) ctx.fillText(+k.toFixed(2) + " kg", X(k), H - B + 4);
  const col = css("--f");
  ctx.strokeStyle = col; ctx.fillStyle = col;
  [...calPts].sort((a, b) => a.kg - b.kg).forEach(p => {
    ctx.beginPath(); ctx.moveTo(X(p.kg), Y(p.min)); ctx.lineTo(X(p.kg), Y(p.max)); ctx.stroke();
    ctx.beginPath(); ctx.arc(X(p.kg), Y(p.mean), 3.5, 0, 2 * Math.PI); ctx.fill();
  });
}

// Akku: grobe Ladezustandsschätzung für LiPo (Ruhespannung, beim Laden zu hoch)
function batPercent(mv) {
  const tbl = [[3300, 0], [3500, 5], [3600, 10], [3700, 25], [3750, 40], [3800, 50], [3900, 65], [4000, 78], [4100, 90], [4200, 100]];
  if (mv <= tbl[0][0]) return 0;
  for (let i = 1; i < tbl.length; i++) if (mv <= tbl[i][0])
    return tbl[i - 1][1] + (mv - tbl[i - 1][0]) / (tbl[i][0] - tbl[i - 1][0]) * (tbl[i][1] - tbl[i - 1][1]);
  return 100;
}

// ---------- Lage (Madgwick-Filter, nur Accel + Gyro) ----------
let q = [1, 0, 0, 0];             // Quaternion Board -> Welt (w, x, y, z)
let gyroBias = [0, 0, 0], lastT = null, ahrsInit = false;
const BETA = 0.08;                // Vertrauen in den Beschleunigungssensor
const D2R = Math.PI / 180;

function ahrsInitFromAccel(ax, ay, az) {
  // Startlage aus der Schwerkraft (Yaw = 0)
  const roll = Math.atan2(ay, az), pitch = Math.atan2(-ax, Math.hypot(ay, az));
  const cr = Math.cos(roll / 2), sr = Math.sin(roll / 2), cp = Math.cos(pitch / 2), sp = Math.sin(pitch / 2);
  q = [cr * cp, sr * cp, cr * sp, -sr * sp];
}

// Vorzeichen der Drehraten (falls eine Achse gegenüber dem Beschleunigungssensor vertauscht wäre)
const GYRO_SIGN = [1, 1, 1];

function ahrsUpdate(v) {
  const t = v[0];
  let ax = v[1], ay = v[2], az = v[3];
  if (!ahrsInit) { if (Math.hypot(ax, ay, az) > 0.5) { ahrsInitFromAccel(ax, ay, az); ahrsInit = true; } lastT = t; return; }
  let dt = (t - lastT) / 1000; lastT = t;
  if (!(dt > 0) || dt > 0.2) return;
  const gx = GYRO_SIGN[0] * (v[4] - gyroBias[0]) * D2R, gy = GYRO_SIGN[1] * (v[5] - gyroBias[1]) * D2R,
        gz = GYRO_SIGN[2] * (v[6] - gyroBias[2]) * D2R;
  let [q0, q1, q2, q3] = q;
  let qd0 = 0.5 * (-q1 * gx - q2 * gy - q3 * gz);
  let qd1 = 0.5 * ( q0 * gx + q2 * gz - q3 * gy);
  let qd2 = 0.5 * ( q0 * gy - q1 * gz + q3 * gx);
  let qd3 = 0.5 * ( q0 * gz + q1 * gy - q2 * gx);
  const an = Math.hypot(ax, ay, az);
  // Korrektur nur, wenn die Beschleunigung nahe 1 g ist (sonst stört Bewegung)
  if (an > 0.7 && an < 1.3) {
    ax /= an; ay /= an; az /= an;
    const _2q0 = 2 * q0, _2q1 = 2 * q1, _2q2 = 2 * q2, _2q3 = 2 * q3;
    const _4q0 = 4 * q0, _4q1 = 4 * q1, _4q2 = 4 * q2, _8q1 = 8 * q1, _8q2 = 8 * q2;
    const q0q0 = q0 * q0, q1q1 = q1 * q1, q2q2 = q2 * q2, q3q3 = q3 * q3;
    let s0 = _4q0 * q2q2 + _2q2 * ax + _4q0 * q1q1 - _2q1 * ay;
    let s1 = _4q1 * q3q3 - _2q3 * ax + 4 * q0q0 * q1 - _2q0 * ay - _4q1 + _8q1 * q1q1 + _8q1 * q2q2 + _4q1 * az;
    let s2 = 4 * q0q0 * q2 + _2q0 * ax + _4q2 * q3q3 - _2q3 * ay - _4q2 + _8q2 * q1q1 + _8q2 * q2q2 + _4q2 * az;
    let s3 = 4 * q1q1 * q3 - _2q1 * ax + 4 * q2q2 * q3 - _2q2 * ay;
    const sn = Math.hypot(s0, s1, s2, s3);
    if (sn > 0) { qd0 -= BETA * s0 / sn; qd1 -= BETA * s1 / sn; qd2 -= BETA * s2 / sn; qd3 -= BETA * s3 / sn; }
  }
  q0 += qd0 * dt; q1 += qd1 * dt; q2 += qd2 * dt; q3 += qd3 * dt;
  const n = Math.hypot(q0, q1, q2, q3);
  q = [q0 / n, q1 / n, q2 / n, q3 / n];
}

function rotate(p) {               // Vektor vom Board- ins Weltsystem drehen
  const [w, x, y, z] = q, [px, py, pz] = p;
  return [
    (1 - 2 * (y * y + z * z)) * px + 2 * (x * y - w * z) * py + 2 * (x * z + w * y) * pz,
    2 * (x * y + w * z) * px + (1 - 2 * (x * x + z * z)) * py + 2 * (y * z - w * x) * pz,
    2 * (x * z - w * y) * px + 2 * (y * z + w * x) * py + (1 - 2 * (x * x + y * y)) * pz,
  ];
}

function draw3d() {
  const canvas = $("view3d"), dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== W * dpr || canvas.height !== H * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // Kamera: schräg von vorne oben, Welt-z zeigt nach oben
  const yaw = camYaw * D2R, elev = camElev * D2R, dist = 6, f = Math.min(W, H) * 1.6;
  const proj = ([x, y, z]) => {
    const x1 = x * Math.cos(yaw) - y * Math.sin(yaw), y1 = x * Math.sin(yaw) + y * Math.cos(yaw);
    const depth = y1 * Math.cos(elev) - z * Math.sin(elev);
    const up = y1 * Math.sin(elev) + z * Math.cos(elev);
    const s = f / (dist + depth);
    return [W / 2 + x1 * s, H / 2 - up * s, depth];
  };
  const camDepth = ([x, y, z]) => (x * Math.sin(yaw) + y * Math.cos(yaw)) * Math.cos(elev) - z * Math.sin(elev);
  const line = (a, b, color, width = 1, dash = []) => {
    const [x1, y1] = proj(a), [x2, y2] = proj(b);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
  };
  const label = (p, text, color) => { const [x, y] = proj(p); ctx.fillStyle = color; ctx.fillText(text, x + 3, y - 3); };
  ctx.font = "12px -apple-system, sans-serif";
  const cx = css("--x"), cy = css("--y"), cz = css("--z"), grid = css("--grid"), muted = css("--muted");

  // Bodengitter und Weltachsen (gestrichelt)
  for (let i = -2; i <= 2; i++) { line([i * 0.5, -1, -0.8], [i * 0.5, 1, -0.8], grid); line([-1, i * 0.5, -0.8], [1, i * 0.5, -0.8], grid); }
  line([0, 0, 0], [1.4, 0, 0], cx, 1, [4, 4]); label([1.4, 0, 0], "X", muted);
  line([0, 0, 0], [0, 1.4, 0], cy, 1, [4, 4]); label([0, 1.4, 0], "Y", muted);
  line([0, 0, 0], [0, 0, 1.4], cz, 1, [4, 4]); label([0, 0, 1.4], "Z", muted);

  drawBoard(proj, rotate, camDepth, ctx);

  // Board-Achsen (durchgezogen)
  line([0, 0, 0], rotate([1.1, 0, 0]), cx, 3); label(rotate([1.1, 0, 0]), "x", cx);
  line([0, 0, 0], rotate([0, 1.1, 0]), cy, 3); label(rotate([0, 1.1, 0]), "y", cy);
  line([0, 0, 0], rotate([0, 0, 1.1]), cz, 3); label(rotate([0, 0, 1.1]), "z", cz);

  // Euler-Winkel zur Anzeige
  const [w, x, y, z] = q;
  const roll = Math.atan2(2 * (w * x + y * z), 1 - 2 * (x * x + y * y)) / D2R;
  const pitch = Math.asin(Math.max(-1, Math.min(1, 2 * (w * y - z * x)))) / D2R;
  const yawE = Math.atan2(2 * (w * z + x * y), 1 - 2 * (y * y + z * z)) / D2R;
  $("vroll").textContent = fmt(roll, 0, 4); $("vpitch").textContent = fmt(pitch, 0, 4); $("vyaw").textContent = fmt(yawE, 0, 4);
}

// Zuordnung Board -> Sensorachsen (Zeilen = Sensor x, y, z), aus einer Testaufnahme bestimmt:
// +z zeigt aus der Bauteilseite, +y zeigt von der USB-Buchse weg, +x (von oben, USB oben) nach links.
const BOARD_TO_SENSOR = [[-1, 0, 0], [0, -1, 0], [0, 0, 1]];
const MM = 1 / 12;                // mm -> Darstellungseinheiten
const toSensor = b => BOARD_TO_SENSOR.map(r => (r[0] * b[0] + r[1] * b[1] + r[2] * b[2]) * MM);

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  return `rgb(${c.map(v => Math.round(Math.min(255, v * f))).join(",")})`;
}

function drawBoard(proj, rotate, camDepth, ctx) {
  // Quader: 6 Flächen (Ecken in Board-mm, Normale)
  const boxFaces = (cx, cy, cz, sx, sy, sz) => {
    const c = (i, j, k) => [cx + i * sx / 2, cy + j * sy / 2, cz + k * sz / 2];
    return [
      [[c(-1,-1,-1), c(-1,1,-1), c(-1,1,1), c(-1,-1,1)], [-1, 0, 0]],
      [[c(1,-1,-1), c(1,-1,1), c(1,1,1), c(1,1,-1)], [1, 0, 0]],
      [[c(-1,-1,-1), c(-1,-1,1), c(1,-1,1), c(1,-1,-1)], [0, -1, 0]],
      [[c(-1,1,-1), c(1,1,-1), c(1,1,1), c(-1,1,1)], [0, 1, 0]],
      [[c(-1,-1,-1), c(1,-1,-1), c(1,1,-1), c(-1,1,-1)], [0, 0, -1]],
      [[c(-1,-1,1), c(-1,1,1), c(1,1,1), c(1,-1,1)], [0, 0, 1]]];
  };
  // USB-C-Buchse: Stadion-Querschnitt (x-z), entlang y extrudiert
  const stadium = (cx, cz, w, h, N = 10) => {
    const r = h / 2, P = [];
    for (let i = 0; i <= N; i++) { const a = -Math.PI / 2 + Math.PI * i / N; P.push([cx + (w / 2 - r) + r * Math.cos(a), cz + r * Math.sin(a)]); }
    for (let i = 0; i <= N; i++) { const a = Math.PI / 2 + Math.PI * i / N; P.push([cx - (w / 2 - r) + r * Math.cos(a), cz + r * Math.sin(a)]); }
    return P;   // gegen den Uhrzeigersinn in (x, z)
  };
  const usbFaces = (cx, cy, cz, sx, sy, sz) => {
    const P = stadium(cx, cz, sx, sz), y0 = cy - sy / 2, y1 = cy + sy / 2, F = [];
    for (let i = 0; i < P.length; i++) {
      const p = P[i], q = P[(i + 1) % P.length];
      const nx = q[1] - p[1], nz = -(q[0] - p[0]), l = Math.hypot(nx, nz);
      F.push([[[p[0], y0, p[1]], [q[0], y0, q[1]], [q[0], y1, q[1]], [p[0], y1, p[1]]], [nx / l, 0, nz / l]]);
    }
    F.push([P.map(p => [p[0], y1, p[1]]), [0, 1, 0]]);
    F.push([P.map(p => [p[0], y0, p[1]]).reverse(), [0, -1, 0]]);
    // Steckeröffnung (dunkel), knapp vor der Stirnfläche
    F.push([stadium(cx, cz, sx - 0.9, sz - 0.9).map(p => [p[0], y1 + 0.02, p[1]]), [0, 1, 0], "usbhole"]);
    return F;
  };
  const items = BOARD_BOXES.map(([kind, cx, cy, cz, sx, sy, sz]) => {
    const F = (kind === "usb" ? usbFaces : boxFaces)(cx, cy, cz, sx, sy, sz).map(([pts, n, k]) => {
      const nw = rotate(toSensor(n));
      return { P: pts.map(v => proj(rotate(toSensor(v)))), nw, kind: k || kind };
    });
    return { kind, cz, F, depth: camDepth(rotate(toSensor([cx, cy, cz]))) };
  });
  const drawItem = it => {
    for (const f of it.F) {
      if (camDepth(f.nw) >= 0) continue;                  // Rückseite
      const light = 0.55 + 0.45 * Math.max(0, f.nw[2]);   // Licht von oben
      ctx.beginPath(); f.P.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      const col = shade(BOARD_COLORS[f.kind] || "#777", light);
      ctx.closePath(); ctx.fillStyle = col; ctx.fill();
      if (it.kind === "usb" && f.P.length === 4) { ctx.strokeStyle = col; ctx.lineWidth = 0.8; }   // runde Mantelfläche ohne Nähte
      else { ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 0.5; }
      ctx.stroke();
    }
  };
  // Was auf der abgewandten Seite der Platine liegt, zuerst; dann Platine; dann die sichtbare Seite
  const topVisible = camDepth(rotate(toSensor([0, 0, 1]))) < 0;
  const pcb = items.filter(i => i.kind === "pcb");
  const others = items.filter(i => i.kind !== "pcb").sort((a, b) => b.depth - a.depth);
  const hidden = others.filter(i => (i.cz > 0) !== topVisible), visible = others.filter(i => (i.cz > 0) === topVisible);
  hidden.forEach(drawItem); pcb.forEach(drawItem); visible.forEach(drawItem);
}

// ---------- Zeichnen ----------
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function niceStep(range) {
  const raw = range / 5, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / mag;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
}

function drawChart(canvas, cols, minSpan, colorVars = ["--x", "--y", "--z"], fromZero = false) {
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== W * dpr || canvas.height !== H * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const L = 48, R = 8, T = 6, B = 20, pw = W - L - R, ph = H - T - B;
  const win = Number($("window").value) * 1000;
  const tEnd = buf.length ? buf[buf.length - 1][0] : win, tStart = tEnd - win;
  let s = buf.length - 1;
  while (s > 0 && buf[s - 1][0] >= tStart) s--;
  const pts = buf.slice(Math.max(s, 0));

  let lo = Infinity, hi = -Infinity;
  for (const p of pts) for (const c of cols) { lo = Math.min(lo, p[c]); hi = Math.max(hi, p[c]); }
  if (!isFinite(lo)) { lo = -minSpan; hi = minSpan; }
  if (fromZero) { lo = 0; hi = Math.max(hi, minSpan) * 1.1; }
  else {
    const mid = (lo + hi) / 2, span = Math.max(hi - lo, minSpan) * 1.1;
    lo = mid - span / 2; hi = mid + span / 2;
  }
  const X = t => L + (t - tStart) / win * pw;
  const Y = v => T + (hi - v) / (hi - lo) * ph;

  ctx.font = "11px -apple-system, sans-serif";
  ctx.fillStyle = css("--muted"); ctx.strokeStyle = css("--grid"); ctx.lineWidth = 1;
  const step = niceStep(hi - lo);
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    const y = Math.round(Y(v)) + .5;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.fillText((Math.abs(v) < 1e-9 ? 0 : +v.toFixed(3)).toString(), L - 6, y);
  }
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  // Abstand der Zeitmarken so wählen, dass sich die Beschriftungen nicht überlappen (wichtig auf dem Handy)
  const labelW = ctx.measureText((tEnd / 1000).toFixed(0) + " s").width + 14;
  const tStep = [1, 2, 5, 10, 15, 30, 60, 120, 300].find(st => st * 1000 / win * pw >= labelW) || 600;
  for (let t = Math.ceil(tStart / (tStep * 1000)) * tStep * 1000; t <= tEnd; t += tStep * 1000)
    ctx.fillText((t / 1000).toFixed(0) + " s", Math.min(X(t), W - labelW / 2 + 6), H - B + 4);

  const colors = colorVars.map(css);
  ctx.lineWidth = 1.5; ctx.lineJoin = "round";
  cols.forEach((c, k) => {
    ctx.strokeStyle = colors[k];
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[c])) : ctx.moveTo(X(p[0]), Y(p[c])));
    ctx.stroke();
  });
}

function frame() {
  const now = performance.now();
  if (now - rateT0 >= 1000) { rateHz = rateCount * 1000 / (now - rateT0); rateCount = 0; rateT0 = now; }
  if ((port || bleDev) && buf.length) {
    const rec = recording ? T("stRec", recording.length) : "";
    setStatus(`${bleDev ? "Bluetooth" : "USB"} · ${rateHz.toFixed(0).padStart(3, "\u2007")} Hz${rec}`);
  }
  if (!paused) {
    if (page === "imu") {
      drawChart($("acc"), [1, 2, 3, 7], 0.5, ["--x", "--y", "--z", "--m"]);
      drawChart($("gyr"), [4, 5, 6, 8], 20, ["--x", "--y", "--z", "--m"]);
      draw3d();
    } else if (page === "cal") {
      drawChart($("fsrc"), [9], 100, ["--f"], true);
      drawCal();
    } else if (page === "align") {
      drawChart($("sagc"), [13], 100, ["--z"]);
      const l = buf[buf.length - 1];
      $("vsag").textContent = l && Number.isFinite(l[13]) ? fmt(l[13], 0, 5) : "–";
    } else if (page === "gait") {
      renderGait();
    }
    const last = buf[buf.length - 1];

      ctx.fillStyle = css("--muted"); if (p) ctx.fillText(name, (X(b[p]) + X(b[p + 1])) / 2, 2);
    });
  }
  ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = css("--muted");
  for (let pct = 0; pct <= 100; pct += 20) ctx.fillText(pct + " %", Math.min(X(pct), W - 16), H - B + 4);
  if (!sel.length) return;
  const xc = b => X((b + 0.5) * 100 / BINS), col = css("--f");
  ctx.fillStyle = col; ctx.globalAlpha = 0.18; ctx.beginPath();
  m.forEach((v, b) => b ? ctx.lineTo(xc(b), Y(v + sd[b])) : ctx.moveTo(xc(b), Y(v + sd[b])));
  for (let b = BINS - 1; b >= 0; b--) ctx.lineTo(xc(b), Y(Math.max(0, m[b] - sd[b])));
  ctx.fill(); ctx.globalAlpha = 1;
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
  m.forEach((v, b) => b ? ctx.lineTo(xc(b), Y(v)) : ctx.moveTo(xc(b), Y(v))); ctx.stroke();
}
function drawTrend() {
  const [ctx, W, H] = canvasCtx($("gTr")), L = 48, R = 8, Tp = 8, B = 20, pw = W - L - R, ph = H - Tp - B;
  const pts = steps.slice(-300), hi = Math.max(1, ...pts.map(s => s.fpk)) * 1.1;
  const X = i => L + (pts.length > 1 ? i / (pts.length - 1) : 0.5) * pw, Y = v => Tp + (1 - v / hi) * ph;
  yAxis(ctx, L, R, W, Y, hi, "");
  ctx.fillStyle = css("--muted"); ctx.textAlign = "center"; ctx.textBaseline = "top";
  if (pts.length) { ctx.fillText("#" + pts[0].seq, L + 12, H - B + 4); ctx.fillText("#" + pts[pts.length - 1].seq, W - R - 14, H - B + 4); }
  [["fpk", "--f"], ["lr", "--z"]].forEach(([k, c]) => {
    ctx.strokeStyle = css(c); ctx.lineWidth = 1.5; ctx.beginPath();
    pts.forEach((s, i) => { const v = k === "lr" ? s.phm[1] : s[k]; i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)); });
    ctx.stroke();
  });
}
function renderGait() {
  $("gSrc").textContent = T(bleDev && stepChr ? "gSrcBle" : port ? "gSrcUsb" : "gSrcNone");
  if (!gaitDirty) return;
  gaitDirty = false;
  const sel = selSteps(), f = (x, d) => Number.isFinite(x) ? x.toFixed(d) : "–";
  const str = mean(sel.map(s => s.stride));
  $("gtN").textContent = steps.length;
  $("gtCad").textContent = f(120000 / str, 0);
  $("gtStride").textContent = f(str / 1000, 2);
  $("gtStance").textContent = f(mean(sel.map(s => 100 * s.stance / s.stride)), 0);
  $("gtPeak").textContent = f(mean(sel.map(s => s.fpk)), 1);
  $("gtLR").textContent = f(mean(sel.map(s => s.phm[1])), 1);
  $("gtSwing").textContent = f(mean(sel.map(s => s.fsw)), 2);
  drawPhases(sel); drawCycle(sel); drawTrend();
  $("gTb").innerHTML = steps.slice(-30).reverse().map(s =>
    `<tr><td>${s.seq}</td><td>${(s.t / 1000).toFixed(1)}</td><td>${s.stride}</td><td>${(100 * s.stance / s.stride).toFixed(0)}</td>` +
    `<td>${s.ms.toFixed(0)}</td><td>${s.fpk.toFixed(1)}</td><td>${s.fmean.toFixed(1)}</td>` +
    s.phm.slice(1, 5).map(x => `<td>${x.toFixed(1)}</td>`).join("") + `<td>${s.fsw.toFixed(2)}</td>` +
    `<td title="flags">${s.flags & 1 ? "⚠" : ""}${s.flags & 2 ? "" : "auto"}</td></tr>`).join("");
}
window.addEventListener("resize", () => { gaitDirty = true; });
refreshSag();

// ---------- Seiten (Tabs) ----------
let page = "imu";
function setPage(p) {
  if (!["imu", "cal", "align", "gait", "fw"].includes(p)) p = "imu";
  page = p;
  document.body.dataset.page = p;
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.page === p));
  try { localStorage.setItem("feo-page", p); } catch (e) {}
  if (location.hash !== "#" + p) history.replaceState(null, "", "#" + p);
  updateStreaming(); gaitDirty = true;
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => setPage(b.dataset.page));
window.addEventListener("hashchange", () => setPage(location.hash.slice(1)));
let startPage = location.hash.slice(1);
if (!startPage) { try { startPage = localStorage.getItem("feo-page"); } catch (e) {} }
setPage(startPage);

requestAnimationFrame(frame);
applyLang();
renderCal();
</script>
