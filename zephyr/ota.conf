# Firmware-Update über Bluetooth (MCUmgr/SMP, Image-Upload in Slot 1, MCUboot tauscht beim Neustart).
# Nur für den Sysbuild-Build mit MCUboot: west build ... -- -DEXTRA_CONF_FILE=ota.conf
# (siehe .github/workflows/release.yml). Der PlatformIO-Build bleibt ohne OTA.

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_REBOOT=y

CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# große Pakete (bis zur MTU) und ohne Kopplung beschreibbar
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
