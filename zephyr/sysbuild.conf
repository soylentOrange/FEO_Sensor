# Sysbuild (west build --sysbuild): MCUboot als Bootloader mitbauen.
# Das Anwendungsimage wird damit signiert (zephyr.signed.bin) und kann per BLE aktualisiert werden.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# Signatur ECDSA P-256 (passt zu "imgtool keygen -t ecdsa-p256", siehe README).
# Ohne eigenen Schlüssel nimmt MCUboot seinen öffentlichen Test-Schlüssel root-ec-p256.pem.
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
